aid: listrunner
name: Listrunner
description: >-
  Listrunner was a HIPAA-compliant clinical collaboration platform that let hospital care teams
  build and share living patient lists. Marketed as "a collaboration platform for clinicians,"
  it targeted specialty practices, residency programs, hospital departments, and outpatient
  teams with shared sign-out/handoff lists, faster rounding, coordinated discharge tracking,
  task assignment, real-time lab and clinical data access, EHR integration, printable
  rounding lists, fully customizable per-team list fields, administrator-controlled user
  permissions and data access, audit logs and reporting, and a robust offline mode across
  web plus native iOS and Android apps. Listrunner no longer operates as an independent
  product: its brand domains listrunner.health and listrunnerapp.com are now served from
  Cloudflare and redirect (301 then 307) to commure.com, the healthcare-infrastructure company
  that merged with Athelas. The last archived standalone Listrunner homepage is from 2021-06-04.
  Listrunner never published a public API, developer portal, SDK, or package; it is retained in
  the API Evangelist network as a historical health-tech identity record and a pointer to its
  successor surface at Commure/Athelas, not as an API provider.
